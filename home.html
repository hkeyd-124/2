<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HackChem SPA</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#f5f7fb;
  display:flex;
  min-height:100vh;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  background:white;
  border-right:1px solid #eee;
  padding:20px;
  overflow:auto;
}

.logo{
  font-size:28px;
  font-weight:bold;
  margin-bottom:35px;
}

.menu-item{
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  margin-bottom:12px;
  transition:0.2s;
  font-weight:bold;
}

.menu-item:hover{
  background:#f1f5f9;
  transform:translateX(4px);
}

.menu-item.active{
  background:#111;
  color:white;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* =========================
   HERO
========================= */

.hero{
  background:white;
  padding:35px;
  border-radius:24px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.hero h1{
  font-size:34px;
}

.hero p{
  margin-top:10px;
  color:#666;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:22px;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.card:hover{
  transform:translateY(-5px);
}

.card-icon{
  font-size:34px;
}

.card h3{
  margin-top:15px;
}

.card p{
  margin-top:10px;
  color:#666;
}

/* =========================
   SPA CONTAINER
========================= */

#spaContainer{
  display:none;
  animation:fadeIn .25s ease;
}

.loading-box{
  background:white;
  padding:50px;
  border-radius:24px;
  text-align:center;
  color:#666;
}

/* =========================
   ANIMATION
========================= */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .sidebar{
    width:90px;
    padding:15px 10px;
  }

  .logo{
    font-size:16px;
    text-align:center;
  }

  .menu-item{
    font-size:12px;
    text-align:center;
    padding:10px 5px;
  }

  .main{
    padding:15px;
  }

  .hero h1{
    font-size:24px;
  }
}

</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

  <div class="logo">
    🧪 HACKCHEM
  </div>

  <div class="menu-item active"
       id="menu-home"
       onclick="loadHome()">

    🏠 Home

  </div>

  <div class="menu-item"
       id="menu-courses"
       onclick="loadTab('courses')">

    📘 Courses

  </div>

  <div class="menu-item"
       id="menu-resources"
       onclick="loadTab('resources')">

    📚 Resources

  </div>

  <div class="menu-item"
       id="menu-leaderboard"
       onclick="loadTab('leaderboard')">

    🏆 Leaderboard

  </div>

</div>

<!-- =========================
     MAIN
========================= -->

<div class="main">

  <!-- HOME -->

  <div id="homeContent">

    <div class="hero">

      <h1>
        👋 Welcome to HackChem
      </h1>

      <p>
        Production Single Layer SPA Architecture
      </p>

    </div>

    <div class="cards">

      <div class="card"
           onclick="loadTab('courses')">

        <div class="card-icon">📘</div>

        <h3>Courses</h3>

        <p>
          Explore chemistry lessons
        </p>

      </div>

      <div class="card"
           onclick="loadTab('resources')">

        <div class="card-icon">📚</div>

        <h3>Resources</h3>

        <p>
          Study materials
        </p>

      </div>

      <div class="card"
           onclick="loadTab('leaderboard')">

        <div class="card-icon">🏆</div>

        <h3>Leaderboard</h3>

        <p>
          Rankings and scores
        </p>

      </div>

    </div>

  </div>

  <!-- SPA CONTENT -->

  <div id="spaContainer"></div>

</div>

<!-- =========================
     MAIN SCRIPT
========================= -->

<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  db
}
from "./firebase.js";

import {

  collection,
  getDocs,
  doc,
  getDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   GLOBAL EXPORT
========================= */

window.db = db;

window.collection = collection;

window.getDocs = getDocs;

window.doc = doc;

window.getDoc = getDoc;

/* =========================
   GLOBAL
========================= */

window.currentTab = "home";

window.tabCache = {};

/* =========================
   ACTIVE MENU
========================= */

window.setActiveMenu = function(id){

  document.querySelectorAll(".menu-item")
    .forEach(el=>el.classList.remove("active"));

  const menu =
    document.getElementById(`menu-${id}`);

  if(menu){
    menu.classList.add("active");
  }
}

/* =========================
   HOME
========================= */

window.loadHome = function(){

  window.currentTab = "home";

  setActiveMenu("home");

  document.getElementById(
    "homeContent"
  ).style.display = "block";

  document.getElementById(
    "spaContainer"
  ).style.display = "none";
}

/* =========================
   LOAD TAB
========================= */

window.loadTab = async function(tab){

  try{

    window.currentTab = tab;

    setActiveMenu(tab);

    document.getElementById(
      "homeContent"
    ).style.display = "none";

    const container =
      document.getElementById(
        "spaContainer"
      );

    container.style.display = "block";

    container.innerHTML = `
      <div class="loading-box">
        ⏳ Loading ${tab}...
      </div>
    `;

    /* CACHE */

    if(window.tabCache[tab]){

      container.innerHTML =
        window.tabCache[tab];

    }else{

      const res =
        await fetch(`tabs/${tab}.html`);

      if(!res.ok){

        throw new Error(
          `Cannot load ${tab}`
        );
      }

      container.innerHTML = "";

      const html =
        await res.text();

      window.tabCache[tab] = html;

      container.innerHTML = html;
    }

    /* =========================
       TAB INIT
    ========================= */

    if(tab === "courses"){

      bindCourseEvents();

      applyCourseProgress();
    }

    if(tab === "leaderboard"){

      setTimeout(()=>{

        loadLessons();

      },100);
    }

  }catch(err){

    console.error(err);

    document.getElementById(
      "spaContainer"
    ).innerHTML = `

      <div class="loading-box">
        ❌ Cannot load ${tab}
      </div>

    `;
  }
}

/* =========================
   RESOURCES TAB
========================= */

window.toggleTopic = function(id){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.style.display =
    el.style.display === "block"
      ? "none"
      : "block";
}

window.openLessonSPA = function(id){

  console.log("OPEN LESSON:", id);

  if(id === "organic_2"){

    window.location.href =
      "lesson/alkane.html?lesson=" + id;

    return;
  }

  window.location.href =
    "lesson/lesson1.html?lesson=" + id;
}

/* =========================
   COURSES TAB
========================= */

const totals = {

  organic_1:15,
  organic_2:15,
  organic_3:15,
  organic_4:15

};

window.toggleCourse = function(id){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.style.display =
    el.style.display === "none"
      ? "block"
      : "none";
}

window.openCourseLesson = function(id,name){

  localStorage.setItem(
    "currentLessonName",
    name
  );

  const map = {

    organic_1:"alkane.html",
    organic_2:"alkane.html",
    organic_3:"alkene.html",
    organic_4:"fuel.html"

  };

  window.location.href =
    "lesson/" +
    map[id] +
    "?lesson=" +
    id;
}

window.bindCourseEvents = function(){

  const buttons =
    document.querySelectorAll(
      ".lesson-btn"
    );

  buttons.forEach(btn=>{

    btn.onclick = ()=>{

      const lesson =
        btn.dataset.lesson;

      const name =
        btn.dataset.name;

      openCourseLesson(
        lesson,
        name
      );

    };

  });
}

window.getCoursePercent = function(id){

  const wallet =
    localStorage.getItem("wallet")
    || "guest";

  const uid =
    localStorage.getItem("uid")
    || wallet;

  const data = JSON.parse(

    localStorage.getItem(
      "progress_" +
      id +
      "_" +
      uid
    )

  );

  if(!data) return 0;

  const correct =

    Object.values(
      data.answers || {}
    )

    .filter(v=>v==="correct")
    .length;

  const total = totals[id];

  return Math.round(
    (correct/total)*100
  );
}

window.setCourseColor = function(el,percent){

  if(percent < 25){

    el.style.background =
      "#F44336";

  }
  else if(percent < 50){

    el.style.background =
      "#FF9800";

  }
  else if(percent < 75){

    el.style.background =
      "#FFC107";

  }
  else{

    el.style.background =
      "#4CAF50";
  }
}

window.checkBossUnlockCourse = function(
  p1,p2,p3,p4
){

  const boss =
    document.getElementById(
      "bossStatus"
    );

  if(!boss) return;

  if(
    p1>=75 &&
    p2>=75 &&
    p3>=75 &&
    p4>=75
  ){

    boss.innerText = "GO";

    boss.style.background =
      "#4CAF50";

  }else{

    boss.innerText = "LOCK";

    boss.style.background =
      "#999";
  }
}

window.openBossLesson = function(){

  const boss =
    document.getElementById(
      "bossStatus"
    );

  if(
    boss &&
    boss.innerText === "LOCK"
  ){

    alert(
      "🔒 Hoàn thành tất cả bài ≥ 75% để mở khóa!"
    );

    return;
  }

  window.location.href =
    "lesson/boss.html";
}

window.applyCourseProgress = function(){

  const p1 =
    getCoursePercent(
      "organic_1"
    );

  const p2 =
    getCoursePercent(
      "organic_2"
    );

  const p3 =
    getCoursePercent(
      "organic_3"
    );

  const p4 =
    getCoursePercent(
      "organic_4"
    );

  const el1 =
    document.getElementById(
      "lesson1Percent"
    );

  const el2 =
    document.getElementById(
      "lesson2Percent"
    );

  const el3 =
    document.getElementById(
      "lesson3Percent"
    );

  const el4 =
    document.getElementById(
      "lesson4Percent"
    );

  const topicEl =
    document.getElementById(
      "topicPercent"
    );

  if(!el1) return;

  el1.innerText = p1 + "%";
  el2.innerText = p2 + "%";
  el3.innerText = p3 + "%";
  el4.innerText = p4 + "%";

  setCourseColor(el1,p1);
  setCourseColor(el2,p2);
  setCourseColor(el3,p3);
  setCourseColor(el4,p4);

  const avg =
    Math.round(
      (p1+p2+p3+p4)/4
    );

  topicEl.innerText =
    avg + "%";

  setCourseColor(
    topicEl,
    avg
  );

  checkBossUnlockCourse(
    p1,p2,p3,p4
  );
}

</script>

<!-- =========================
     MODULES
========================= -->

<script type="module"
        src="js/leaderboard.js">
</script>

</body>
</html>
