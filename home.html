<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HackChem SPA</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#f5f7fb;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:250px;
  background:white;
  border-right:1px solid #eee;
  padding:20px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:30px;
}

.menu-item{
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:10px;
  transition:0.2s;
}

.menu-item:hover{
  background:#f1f5f9;
}

.menu-item.active{
  background:#111;
  color:white;
}

.main{
  flex:1;
  padding:25px;
}

.hero{
  background:white;
  padding:30px;
  border-radius:24px;
  margin-bottom:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:20px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-5px);
}

#spaContainer{
  display:none;
}

.tab-page{
  background:white;
  padding:30px;
  border-radius:24px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">
    🧪 HACKCHEM
  </div>

  <div class="menu-item active" id="menu-home" onclick="loadHome()">
    🏠 Home
  </div>

  <div class="menu-item" id="menu-courses" onclick="loadTab('courses')">
    📘 Courses
  </div>

  <div class="menu-item" id="menu-resources" onclick="loadTab('resources')">
    📚 Resources
  </div>

  <div class="menu-item" id="menu-leaderboard" onclick="loadTab('leaderboard')">
    🏆 Leaderboard
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <!-- HOME CONTENT -->
  <div id="homeContent">

    <div class="hero">
      <h1>👋 Welcome to HackChem</h1>
      <p style="margin-top:10px;color:#666;">
        Single Layer SPA Version
      </p>
    </div>

    <div class="cards">

      <div class="card" onclick="loadTab('courses')">
        <h3>📘 Courses</h3>
        <p style="margin-top:10px;color:#666;">
          Learn chemistry
        </p>
      </div>

      <div class="card" onclick="loadTab('resources')">
        <h3>📚 Resources</h3>
        <p style="margin-top:10px;color:#666;">
          Study materials
        </p>
      </div>

      <div class="card" onclick="loadTab('leaderboard')">
        <h3>🏆 Leaderboard</h3>
        <p style="margin-top:10px;color:#666;">
          Rankings
        </p>
      </div>

    </div>

  </div>

  <!-- SPA CONTENT -->
  <div id="spaContainer"></div>

</div>

<script>

window.currentTab = 'home';

function setActiveMenu(id){

  document.querySelectorAll('.menu-item')
    .forEach(el=>el.classList.remove('active'));

  const menu = document.getElementById(`menu-${id}`);

  if(menu){
    menu.classList.add('active');
  }
}

function loadHome(){

  setActiveMenu('home');

  document.getElementById('homeContent').style.display = 'block';

  document.getElementById('spaContainer').style.display = 'none';
}

async function loadTab(tab){

  try{

    setActiveMenu(tab);

    document.getElementById('homeContent').style.display = 'none';

    const container = document.getElementById('spaContainer');

    container.style.display = 'block';

    container.innerHTML = `
      <div class="tab-page">
        ⏳ Loading ${tab}...
      </div>
    `;

    const res = await fetch(`tabs/${tab}.html`);

    if(!res.ok){
      throw new Error('Cannot load tab');
    }

    const html = await res.text();

    container.innerHTML = html;
if(tab === "courses"){
  applyCourseProgress();
}
  }catch(err){

    console.error(err);

    document.getElementById('spaContainer').innerHTML = `
      <div class="tab-page">
        ❌ Cannot load ${tab}
      </div>
    `;
  }
}

/* =========================
   RESOURCES TAB
========================= */

function toggleTopic(id){

  const el = document.getElementById(id);

  el.style.display =
    el.style.display === "block"
      ? "none"
      : "block";
}

/* lesson navigation */

function openLessonSPA(id){

  console.log("OPEN LESSON:", id);

  /*
    TẠM THỜI:
    vẫn dùng page cũ
  */

  if(id === "organic_2"){

    window.location.href = "alkane.html";

    return;
  }

  window.location.href =
    "lesson/lesson1.html?lesson=" + id;
}

/* =========================
   COURSES TAB
========================= */

const totals = {
  organic_1: 15,
  organic_2: 15,
  organic_3: 15,
  organic_4: 15
};

function toggleCourse(id){

  const el = document.getElementById(id);

  if(!el) return;

  el.style.display =
    el.style.display === "none"
      ? "block"
      : "none";
}

function openCourseLesson(id, name){

  localStorage.setItem(
    "currentLessonName",
    name
  );

  const map = {
    "organic_1": "alkane.html",
    "organic_2": "alkane.html",
    "organic_3": "alkene.html",
    "organic_4": "null"
  };

  window.location.href =
    "lesson/" + map[id] + "?lesson=" + id;
}

function getCoursePercent(id){

  const wallet =
    localStorage.getItem("wallet") || "guest";

  const uid =
    localStorage.getItem("uid") || wallet;

  const data = JSON.parse(
    localStorage.getItem(
      "progress_" + id + "_" + uid
    )
  );

  if(!data) return 0;

  const correct =
    Object.values(data.answers || {})
      .filter(v => v === "correct")
      .length;

  const total = totals[id];

  return Math.round(
    (correct / total) * 100
  );
}

function setCourseColor(el, percent){

  if(percent < 25){
    el.style.background = "#F44336";
  }
  else if(percent < 50){
    el.style.background = "#FF9800";
  }
  else if(percent < 75){
    el.style.background = "#FFC107";
  }
  else{
    el.style.background = "#4CAF50";
  }
}

function checkBossUnlockCourse(
  p1,p2,p3,p4
){

  const boss =
    document.getElementById("bossStatus");

  if(!boss) return;

  if(
    p1>=75 &&
    p2>=75 &&
    p3>=75 &&
    p4>=75
  ){

    boss.innerText = "GO";

    boss.style.background = "#4CAF50";

  }else{

    boss.innerText = "LOCK";

    boss.style.background = "#999";
  }
}

function openBossLesson(){

  const boss =
    document.getElementById("bossStatus");

  if(
    boss &&
    boss.innerText === "LOCK"
  ){

    alert(
      "🔒 Hoàn thành tất cả bài ≥ 75% để mở khóa!"
    );

    return;
  }

  window.location.href =
    "lesson/boss.html";
}

function applyCourseProgress(){

  const p1 =
    getCoursePercent("organic_1");

  const p2 =
    getCoursePercent("organic_2");

  const p3 =
    getCoursePercent("organic_3");

  const p4 =
    getCoursePercent("organic_4");

  const el1 =
    document.getElementById("lesson1Percent");

  const el2 =
    document.getElementById("lesson2Percent");

  const el3 =
    document.getElementById("lesson3Percent");

  const el4 =
    document.getElementById("lesson4Percent");

  const topicEl =
    document.getElementById("topicPercent");

  if(!el1) return;

  el1.innerText = p1 + "%";
  el2.innerText = p2 + "%";
  el3.innerText = p3 + "%";
  el4.innerText = p4 + "%";

  setCourseColor(el1,p1);
  setCourseColor(el2,p2);
  setCourseColor(el3,p3);
  setCourseColor(el4,p4);

  const avg =
    Math.round((p1+p2+p3+p4)/4);

  topicEl.innerText = avg + "%";

  setCourseColor(topicEl,avg);

  checkBossUnlockCourse(
    p1,p2,p3,p4
  );
}

  
</script>
</body>
</html>
