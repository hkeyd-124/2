<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HackChem SPA</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#f5f7fb;
  display:flex;
  min-height:100vh;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  background:white;
  border-right:1px solid #eee;
  padding:20px;
  overflow:auto;
}

.logo{
  font-size:28px;
  font-weight:bold;
  margin-bottom:35px;
}

.menu-item{
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  margin-bottom:12px;
  transition:0.2s;
  font-weight:bold;
}

.menu-item:hover{
  background:#f1f5f9;
  transform:translateX(4px);
}

.menu-item.active{
  background:#111;
  color:white;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* =========================
   HERO
========================= */

.hero{
  background:white;
  padding:35px;
  border-radius:24px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.hero h1{
  font-size:34px;
}

.hero p{
  margin-top:10px;
  color:#666;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:22px;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.card:hover{
  transform:translateY(-5px);
}

.card-icon{
  font-size:34px;
}

.card h3{
  margin-top:15px;
}

.card p{
  margin-top:10px;
  color:#666;
}

/* =========================
   SPA CONTAINER
========================= */

#spaContainer{
  display:none;
  animation:fadeIn .25s ease;
}

.loading-box{
  background:white;
  padding:50px;
  border-radius:24px;
  text-align:center;
  color:#666;
}

/* =========================
   ANIMATION
========================= */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .sidebar{
    width:90px;
    padding:15px 10px;
  }

  .logo{
    font-size:16px;
    text-align:center;
  }

  .menu-item{
    font-size:12px;
    text-align:center;
    padding:10px 5px;
  }

  .main{
    padding:15px;
  }

  .hero h1{
    font-size:24px;
  }
}

</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

  <div class="logo">
    🧪 HACKCHEM
  </div>

  <div class="menu-item active"
       id="menu-home"
       onclick="loadHome()">

    🏠 Home

  </div>

  <div class="menu-item"
       id="menu-courses"
       onclick="loadTab('courses')">

    📘 Courses

  </div>

  <div class="menu-item"
       id="menu-resources"
       onclick="loadTab('resources')">

    📚 Resources

  </div>

  <div class="menu-item"
       id="menu-leaderboard"
       onclick="loadTab('leaderboard')">

    🏆 Leaderboard

  </div>
      
<div class="menu-item"
     onclick="linkWallet()">

  🔗 Link Wallet

</div>
      
</div>

<!-- =========================
     MAIN
========================= -->

<div class="main">

  <!-- HOME -->

  <div id="homeContent">

    <div class="hero">

      <h1>
        👋 Welcome to HackChem
      </h1>

      <p>
        Production Single Layer SPA Architecture
      </p>

    </div>

    <div class="cards">

      <div class="card"
           onclick="loadTab('courses')">

        <div class="card-icon">📘</div>

        <h3>Courses</h3>

        <p>
          Explore chemistry lessons
        </p>

      </div>

      <div class="card"
           onclick="loadTab('resources')">

        <div class="card-icon">📚</div>

        <h3>Resources</h3>

        <p>
          Study materials
        </p>

      </div>

      <div class="card"
           onclick="loadTab('leaderboard')">

        <div class="card-icon">🏆</div>

        <h3>Leaderboard</h3>

        <p>
          Rankings and scores
        </p>

      </div>

    </div>

  </div>

  <!-- SPA CONTENT -->

  <div id="spaContainer"></div>

</div>

<!-- =========================
     MAIN SCRIPT
========================= -->

<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  db
}
from "./firebase.js";

import {

  collection,
  getDocs,
  doc,
  getDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   GLOBAL EXPORT
========================= */

window.db = db;

window.collection = collection;

window.getDocs = getDocs;

window.doc = doc;

window.getDoc = getDoc;

</script>

<!-- =========================
     MODULES
========================= -->
<script type="module"
        src="js/store.js">
</script>
<script type="module"
        src="js/router.js">
</script>
<script type="module"
        src="js/leaderboard.js">
</script>
<script type="module"
        src="js/courses.js">
</script>
<script type="module"
        src="js/resources.js">
</script>
<script type="module"
        src="js/authLink.js">
</script>
      
</body>
</html>
